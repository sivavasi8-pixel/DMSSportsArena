name: Weekly database backup
on:
  schedule: [{ cron: "30 20 * * 0" }]   # Sunday 02:00 IST
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pg_dump "${{ secrets.DIRECT_URL }}" --no-owner -Fc -f arena-$(date +%F).dump
      - uses: actions/upload-artifact@v4
        with: { name: arena-backup, path: "*.dump", retention-days: 90 }
